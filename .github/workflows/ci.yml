name: CI

# Runs on every push and PR. Uses fake LLM/embedding clients, so it needs no secrets and spends no API quota.
# The real-LLM evaluation gate lives in eval.yml (nightly / manual).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit + integration tests (real Postgres, fake LLM)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type-check and production build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production images
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml build
      - name: Start the stack and probe it through nginx
        run: |
          docker compose -f docker-compose.yml up -d
          for i in $(seq 1 40); do
            curl -fs http://localhost:8080/api/health && break
            sleep 3
          done
          curl -fs http://localhost:8080/api/health
          curl -fsI http://localhost:8080/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/some/spa/route)" = "200"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail 100
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
