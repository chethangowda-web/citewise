name: keepalive

# Render's free plan puts a service to sleep after about 15 idle minutes, and a sleeping API shows visitors 502 errors.
# This pings the API and the site every 5 minutes so neither falls asleep. GitHub's scheduler is best effort and can run a
# few minutes late, so for a hard guarantee also add a free uptime monitor (for example UptimeRobot) on the same two URLs.
# Delete this file if you move to a paid plan, where services stay awake.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API and the site
        run: |
          for url in \
            https://citewise-api-nnjj.onrender.com/api/health \
            https://citewise-oxb5.onrender.com/api/health; do
            curl --fail --silent --show-error --max-time 60 --retry 4 --retry-delay 15 --retry-all-errors "$url"
            echo " <- $url"
          done
