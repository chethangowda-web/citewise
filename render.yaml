# Render Blueprint for Citewise, on Render's free plans (no card needed): Postgres (with pgvector), the API, and nginx + the React app.
# Free plans mean: services sleep after ~15 idle minutes (the first visit then waits about a minute) and the free database expires
# after 30 days. For anything long-lived, raise the plans below. Apply it from the Render dashboard: New > Blueprint > pick this
# repository. Values marked `sync: false` are asked for on that screen, so no secret ever lives in this file.
databases:
  - name: citewise-db
    plan: free
    databaseName: rag
    user: rag
    postgresMajorVersion: "16"

services:
  - type: web
    name: citewise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: citewise-db
          property: connectionString
      - key: AUTH_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOW_SIGNUP
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK
        value: "true"
      - key: ML_GUARD
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: USER_DAILY_TOKEN_LIMIT
        value: "60000"
      - key: GLOBAL_DAILY_TOKEN_LIMIT
        value: "400000"
      - key: STALE_AFTER_DAYS
        value: "365"

  - type: web
    name: citewise
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "80"
      # Free plans have no private network, so the site reaches the API over its public HTTPS address.
      - key: BACKEND_URL
        value: https://citewise-api-nnjj.onrender.com
      - key: BACKEND_HOST_HEADER
        value: citewise-api-nnjj.onrender.com
      # Render's edge puts the visitor's address in True-Client-IP; without this every visitor shares one rate-limit bucket.
      - key: REAL_IP_DIRECTIVES
        value: "set_real_ip_from 0.0.0.0/0; real_ip_header True-Client-IP;"
